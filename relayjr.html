<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RelayJR — EQV Group</title>
  <meta name="description" content="RelayJR by EQV Group — coming soon." />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192x192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500&family=Baloo+2:wght@700&display=swap" />
  <link rel="stylesheet" href="shared.css" />
  <style>
    /* ─────────────────────────────────────
       RELAYJR — coming soon holding page
       ───────────────────────────────────── */

    .jr-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6rem 0;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* ── Ambient background graphics ──
       Same ring/dot/squiggle motifs from the LinkedIn banner and homepage,
       just set adrift with slow, staggered idle motion. Purely decorative. */
    .jr-ring {
      position: absolute;
      right: -50px;
      bottom: -50px;
      width: 200px;
      height: 200px;
      opacity: 0.5;
      pointer-events: none;
      animation: jrRingPulse 5.2s ease-in-out infinite 0.6s;
    }
    .jr-dot {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }
    .jr-dot--1 { left: 14%; top: 20%; width: 16px; height: 16px; background: var(--terracotta); opacity: 0.6; animation: jrDotFloat 3.2s ease-in-out infinite; }
    .jr-dot--2 { right: 16%; top: 16%; width: 11px; height: 11px; background: var(--navy); opacity: 0.5; animation: jrDotFloat 2.6s ease-in-out infinite 0.4s; }
    .jr-dot--3 { left: 20%; bottom: 18%; width: 9px; height: 9px; background: var(--navy); opacity: 0.45; animation: jrDotFloat 3.6s ease-in-out infinite 0.8s; }
    .jr-dot--4 { right: 22%; bottom: 14%; width: 13px; height: 13px; background: var(--terracotta); opacity: 0.55; animation: jrDotFloat 2.9s ease-in-out infinite 0.2s; }

    @keyframes jrRingPulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50%      { transform: scale(1.06); opacity: 0.3; }
    }
    @keyframes jrDotFloat {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-10px); }
    }

    .jr-squiggle {
      width: 90px;
      height: 10px;
      margin-top: 6px;
    }
    .jr-squiggle path {
      stroke-dasharray: 200;
      animation: jrSquiggleDraw 3s ease-in-out infinite;
    }
    @keyframes jrSquiggleDraw {
      0%   { stroke-dashoffset: 200; }
      45%  { stroke-dashoffset: 0; }
      70%  { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -200; }
    }

    .jr-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      height: clamp(70px, 14vw, 100px);
    }

    .jr-wordmark {
      font-family: 'Baloo 2', cursive;
      font-weight: 700;
      font-size: clamp(40px, 8vw, 52px);
      color: var(--navy);
    }

    .jr-block {
      display: inline-block;
      width: clamp(36px, 7vw, 48px);
      height: clamp(36px, 7vw, 48px);
      line-height: clamp(36px, 7vw, 48px);
      text-align: center;
      border-radius: 10px;
      font-family: 'Baloo 2', cursive;
      font-weight: 700;
      font-size: clamp(20px, 4vw, 26px);
      color: #fff;
      transform-origin: bottom center;
      opacity: 0;
    }
    .jr-block--j { background: var(--terracotta); box-shadow: 0 4px 0 #96401f; }
    .jr-block--r { background: var(--navy); box-shadow: 0 4px 0 #123a66; }

    @keyframes jrDropSquash {
      0%   { transform: translateY(-60px) scale(1,1); opacity: 0; }
      55%  { transform: translateY(0) scale(1,1); opacity: 1; }
      65%  { transform: translateY(0) scale(1.22,0.78); }
      78%  { transform: translateY(-7px) scale(0.94,1.08); }
      90%  { transform: translateY(0) scale(1.04,0.97); }
      100% { transform: translateY(0) scale(1,1); }
    }
    @keyframes jrIdleBob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }
    .jr-block.show-drop { animation: jrDropSquash 750ms ease-out forwards; }
    .jr-block.show-bob  { opacity: 1; animation: jrIdleBob 1.7s ease-in-out infinite; }

    .jr-coming-soon {
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--grey);
      margin-top: 1.8rem;
    }
  </style>
</head>
<body>
  <!-- nav.js injects the nav automatically -->

  <div class="page-content">
    <div class="jr-body container">
      <svg class="jr-ring" viewBox="0 0 600 600">
        <circle cx="300" cy="300" r="280" fill="none" stroke="#E8916B" stroke-width="4"/>
        <circle cx="300" cy="300" r="200" fill="none" stroke="#E8916B" stroke-width="4" opacity="0.6"/>
      </svg>
      <div class="jr-dot jr-dot--1"></div>
      <div class="jr-dot jr-dot--2"></div>
      <div class="jr-dot jr-dot--3"></div>
      <div class="jr-dot jr-dot--4"></div>

      <div class="jr-logo">
        <span class="jr-wordmark">Relay</span>
        <span class="jr-block jr-block--j" id="jrBlockJ">J</span>
        <span class="jr-block jr-block--r" id="jrBlockR">R</span>
      </div>
      <p class="jr-coming-soon">Coming soon</p>
      <svg class="jr-squiggle" viewBox="0 0 140 14">
        <path d="M2 8 Q 35 2, 70 7 T 138 6" style="stroke:var(--terracotta);" stroke-width="3" fill="none" stroke-linecap="round"/>
      </svg>
    </div>

    <footer class="site-footer container">
      © 2026 Esse Quam Videri Group Pty. Limited
    </footer>
  </div>

  <script src="nav.js"></script>
  <script>
    function playBlock(el, delay) {
      setTimeout(() => {
        el.classList.add('show-drop');
        setTimeout(() => {
          el.classList.remove('show-drop');
          el.classList.add('show-bob');
        }, 750);
      }, delay);
    }
    playBlock(document.getElementById('jrBlockJ'), 0);
    playBlock(document.getElementById('jrBlockR'), 120);
  </script>
</body>
</html>
